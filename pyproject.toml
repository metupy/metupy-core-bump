[project]
name = "metupy"
version = "1.0.0"
description = "Lightweight Python Static Site & Documentation Generator — fast, component-driven, multi-language, zero JS build tools."
readme = "README.md"
requires-python = ">=3.10"
keywords = [
    "static-site-generator",
    "documentation-generator",
    "markdown-to-html",
    "ssg",
    "docs-as-code",
    "i18n",
    "python-framework",
    "metupy",
]

authors = [
    { name = "palembangPy", email = "palembangpy@gmail.com" }
]
maintainers = [
    { name = "tomsdroid", email = "tomsdroid007@gmail.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Documentation",
    "Topic :: Text Processing :: Markup :: Markdown",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

dependencies = [
    "aiofiles>=25.1.0",
    "aiohttp>=3.14.3",
    "aiohttp-jinja2>=1.6",
    "aiohttp-security>=0.5.0",
    "aiohttp-session>=2.12.1",
    "chardet>=7.6.0",
    "deep-translator>=1.11.0",
    "docutils>=0.23",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "lark>=1.3.1",
    "markdown>=3.5.0",
    "peewee>=4.4.0",
    "pluggy>=1.6.0",
    "pygments>=2.21.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "rich>=15.0.0",
    "watchdog>=6.0.0",
    "websockets>=16.1.1",
]


[project.scripts]
pym = "metupy.cli:main"

[project.urls]
Homepage = "https://metupy.palembangpy.org"
Documentation = "https://docs.metupy.com/"
Repository = "https://github.com/metupy/metupy"
Issues = "https://github.com/metupy/metupy/issues"

[build-system]
requires = ["flit-core>=3.10,<4"]
build-backend = "flit_core.buildapi"

[dependency-groups]
dev = [
    "python-dotenv>=1.2.3",
]
