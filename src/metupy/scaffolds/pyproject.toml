# pyproject.toml
[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "metupy"
version = "2.0.0"
description = "Markdown Engine Template Utilities Python - Modern Static Site Generator"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Metupy Team", email = "team@metupy.dev"},
]
maintainers = [
    {name = "Metupy Team", email = "team@metupy.dev"},
]
keywords = ["ssg", "static-site", "markdown", "jinja2", "python", "cms", "blog", "docs"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Markup",
]

[project.urls]
Homepage = "https://metupy.dev"
Documentation = "https://metupy.dev/docs"
Repository = "https://github.com/metupy/metupy"
Issues = "https://github.com/metupy/metupy/issues"
Changelog = "https://github.com/metupy/metupy/blob/main/CHANGELOG.md"

[project.scripts]
metupy = "metupy.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "black>=23.0",
    "isort>=5.12",
    "flake8>=6.0",
    "mypy>=1.0",
]
studio = [
    "aiohttp>=3.9",
    "aiohttp-jinja2>=1.5",
    "aiohttp-session>=2.12",
    "aiohttp-security>=0.4",
    "peewee>=3.17",
    "itsdangerous>=2.1",
]
database = [
    "peewee>=3.17",
    "psycopg2-binary>=2.9",
    "pymysql>=1.1",
]
search = [
    "elasticsearch>=8.0",
    "whoosh>=2.7",
]
comments = [
    "redis>=5.0",
]
full = [
    "aiohttp>=3.9",
    "aiohttp-jinja2>=1.5",
    "aiohttp-session>=2.12",
    "aiohttp-security>=0.4",
    "peewee>=3.17",
    "itsdangerous>=2.1",
    "redis>=5.0",
    "httpx>=0.25",
]

[tool.flit.sdist]
include = [
    "metupy/**",
    "bin/**",
    "templates/**",
    "static/**",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]

[tool.flit.module]
name = "metupy"

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
asyncio_mode = "auto"