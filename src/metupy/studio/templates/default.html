<!-- metupy/templates/default.html -->
<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ seo_title }}</title>
    <meta name="description" content="{{ seo_description }}">
</head>
<body>
    <header>
        <nav>
            <a href="/">{{ site.name }}</a>
        </nav>
    </header>
    <main>
        {{ content | safe }}
    </main>
    <footer>
        <p>&copy; {{ now.year }} {{ site.name }}</p>
    </footer>
</body>
</html>
